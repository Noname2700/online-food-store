services:
  postgres:
    image: postgres:latest
    container_name: foodstore-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: pass 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    
  redis:
    image: redis:latest
    container_name: foodstore-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: